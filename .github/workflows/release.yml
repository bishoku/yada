# .github/workflows/release.yml
name: Release Tauri App & Confluence DC Plugin

on:
  push:
    tags:
      - 'v*' # v1.0.0, v0.0.1, vb.

jobs:
  release-tauri:
    name: Release Tauri (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Ensure provisioning profile placeholder for macOS
        if: matrix.platform == 'macos-latest'
        run: touch src-tauri/embedded.provisionprofile

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # Pushlanan tag adını kullanır (örn: v0.0.1)
          releaseName: 'YADA ${{ github.ref_name }}'
          releaseBody: 'Release version ${{ github.ref_name }}. See below for platform binaries and Confluence DC plugin.'
          releaseDraft: false
          prerelease: false

  release-confluence-dc:
    name: Release Confluence DC Plugin (.jar / .obr)
    needs: release-tauri
    if: always() && !cancelled()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Confluence DC Frontend Assets
        run: npm run build:dc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build Confluence DC Plugin (JAR and OBR)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building Confluence DC plugin version: $VERSION"
          mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false -f confluence-dc/pom.xml
          mvn clean package -DskipTests -f confluence-dc/pom.xml

      - name: Upload Confluence DC Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            confluence-dc/target/yada-confluence-dc-*.jar
            confluence-dc/target/yada-confluence-dc-*.obr

